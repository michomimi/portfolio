<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Micheal Jabour</title>
<meta name="description" content="Curriculum vitae for Micheal Jabour, full-stack developer in Calgary.">
<meta name="theme-color" content="#07090C">

<!-- Theme is set before the stylesheet paints, otherwise someone on the
     light theme gets a flash of dark on every page load. Inline and
     synchronous on purpose: an external file would run too late. -->
<script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("portfolio-theme");
if(t!=="light"&&t!=="dark"){t=window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}
d.dataset.theme=t;}catch(e){d.dataset.theme="dark";}
/* Turn the scroll reveal on. Set here, before first paint, so copy never
   flashes in and then hides. The timer is the safety net: if nothing has
   been revealed after 2.2s the class is dropped and everything shows. */
d.className+=" js";
setTimeout(function(){if(!document.querySelector(".reveal.in")){d.classList.remove("js");}},2200);})();</script>

<body data-page="resume">
<main id="main">
  <section style="padding-top:clamp(40px,6vw,72px)">
    <!--
      One page, built from the same PROFILE as the site, so the CV and the
      portfolio can never drift apart. The print stylesheet strips the
      chrome and prints link destinations, so "Print or save PDF" in the
      header produces something you can attach to an application.
    -->
    <div class="wrap" style="max-width:820px" data-cv></div>
  </section>
</main>

<script src="js/motion.js?v=2" defer></script>
